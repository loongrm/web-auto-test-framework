# JSONPlaceholder - 永久免费，无需 API Key
# https://jsonplaceholder.typicode.com

base_url: "https://jsonplaceholder.typicode.com"

posts:
  - id: TC_API_001
    desc: "获取文章列表"
    method: GET
    path: "/posts"
    params:
      _page: 1
      _limit: 10
    expected_status: 200
    expected_fields:
      - "[0].id"
      - "[0].title"
      - "[0].userId"

  - id: TC_API_002
    desc: "获取单篇文章"
    method: GET
    path: "/posts/1"
    expected_status: 200
    expected_fields:
      - "id"
      - "title"
      - "body"
      - "userId"

  - id: TC_API_003
    desc: "获取不存在的文章"
    method: GET
    path: "/posts/9999"
    expected_status: 404

  - id: TC_API_004
    desc: "创建新文章"
    method: POST
    path: "/posts"
    body:
      title: "自动化测试文章"
      body: "这是由自动化测试创建的文章内容"
      userId: 1
    expected_status: 201
    expected_fields:
      - "id"
      - "title"
      - "body"
      - "userId"

  - id: TC_API_005
    desc: "更新文章信息"
    method: PUT
    path: "/posts/1"
    body:
      id: 1
      title: "更新后的标题"
      body: "更新后的内容"
      userId: 1
    expected_status: 200
    expected_fields:
      - "id"
      - "title"

  - id: TC_API_006
    desc: "删除文章"
    method: DELETE
    path: "/posts/1"
    expected_status: 200

users:
  - id: TC_USER_001
    desc: "获取用户列表"
    method: GET
    path: "/users"
    expected_status: 200
    expected_fields:
      - "[0].id"
      - "[0].name"
      - "[0].email"

  - id: TC_USER_002
    desc: "获取单个用户"
    method: GET
    path: "/users/1"
    expected_status: 200
    expected_fields:
      - "id"
      - "name"
      - "email"
      - "phone"

  - id: TC_USER_003
    desc: "获取不存在的用户"
    method: GET
    path: "/users/9999"
    expected_status: 404

comments:
  - id: TC_CMT_001
    desc: "按文章ID查询评论"
    method: GET
    path: "/comments"
    params:
      postId: 1
    expected_status: 200
    expected_fields:
      - "[0].postId"
      - "[0].email"
      - "[0].body"

todos:
  - id: TC_TODO_001
    desc: "获取待办事项列表"
    method: GET
    path: "/todos"
    params:
      userId: 1
    expected_status: 200
    expected_fields:
      - "[0].id"
      - "[0].title"
      - "[0].completed"