[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --alluredir=reports/allure-results
    --clean-alluredir
    -p no:warnings
markers =
    smoke: 冒烟测试
    regression: 回归测试
    p0: P0级别用例
    p1: P1级别用例
    ui: UI自动化测试
    api: API自动化测试
log_cli = true
log_cli_level = INFO