browser:
  type: chromium
  headless: false
  slow_mo: 0
  timeout: 30000
  viewport:
    width: 1920
    height: 1080
  locale: zh-CN
  timezone: Asia/Shanghai

# UI 测试目标站点
base_url: "https://www.saucedemo.com"

# API 测试目标站点（JSONPlaceholder，永久免费无需Key）
api_base_url: "https://jsonplaceholder.typicode.com"

allure:
  results_dir: "reports/allure-results"
  report_dir:  "reports/allure-report"

screenshot:
  on_failure: true
  dir: "screenshots"
  full_page: true

log:
  level: "DEBUG"
  dir: "logs"
  retention: "7 days"
  rotation: "00:00"

retry:
  count: 2
  delay: 1.0

database:
  url: "sqlite+aiosqlite:///./data/test_results.db"